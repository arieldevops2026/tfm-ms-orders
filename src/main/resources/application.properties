#=============================================>    HTTP    <=============================================#
quarkus.http.port=18000
quarkus.http.host=0.0.0.0
#=========================================================================================================#


#=============================================>    REST    <==============================================#
quarkus.rest.path=/api/v1
#=========================================================================================================#


#===========================================>   APLICACION   <============================================#
quarkus.application.name=ms-orders

# Identifican la version desplegada en metricas y trazas. Se sobreescriben con APP_VERSION y APP_ENVIRONMENT.
app.version=1.0.0
app.environment=local
#=========================================================================================================#


#===========================================>   LOGS   <==================================================#
quarkus.log.file.enabled=false
quarkus.log.file.path=logs/server.log
quarkus.log.file.level=ALL
quarkus.log.file.async.queue-length=10000
quarkus.log.file.rotation.max-backup-index=200
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.max-file-size=200M
quarkus.log.file.rotation.file-suffix=yyyy-MM-dd
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} || %X{uuid} || %X{account} || thread: %-20t id: %-3t{id} || %-5p || %-25C{1} || %s%e%n
quarkus.log.console.level=ALL
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} || %X{uuid} || %X{account} || thread: %-20t id: %-3t{id} || %-5p || %-25C{1} || %s%e%n

quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=5000
#=========================================================================================================#


#===========================================>    SWAGGER    <=============================================#
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
#=========================================================================================================#


#============================================>    HILOS    <==============================================#
quarkus.virtual-threads.enabled=true
#=========================================================================================================#


#=========================================>    OBSERVABILIDAD    <=========================================#
# Metricas Prometheus en /q/metrics. Se excluyen del SLI las rutas de infraestructura.
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*,/swagger-ui.*

# Atributos de recurso OpenTelemetry (service.name se toma de quarkus.application.name)
quarkus.otel.resource.attributes=deployment.environment=${app.environment},service.version=${app.version}

# Sin colector local no se exportan trazas. En el cluster se activa con QUARKUS_OTEL_SDK_DISABLED=false
# y se apunta al Collector con QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
# Exporta tambien los logs por OTLP (trazas y metricas ya van por defecto)
quarkus.otel.logs.enabled=true

%dev.quarkus.otel.sdk.disabled=false
%test.quarkus.otel.sdk.disabled=true
#=========================================================================================================#


#======================================>    INYECCION DE FALLOS    <=====================================#
# Modo: NONE | LATENCY | ERROR | TIMEOUT. Se sobreescribe con FAULT_MODE, FAULT_LATENCY_MS, etc.
# probability = proporcion de peticiones afectadas (0.0 a 1.0)
fault.mode=LATENCY
fault.latency-ms=700
fault.timeout-ms=10000
fault.probability=0.3
#=========================================================================================================#


#===========================================>    MS-PRODUCTS    <==========================================#
# URL base sobrescribible con MS_PRODUCTS_URL (en el cluster apunta al Service de Kubernetes)
quarkus.rest-client.ms-products.url=${MS_PRODUCTS_URL:http://localhost:18001/api/v1/}

# Timeouts acotados: un reintento o una espera larga distorsionarian la latencia medida en los experimentos
quarkus.rest-client.ms-products.read-timeout=3000
quarkus.rest-client.ms-products.connect-timeout=1000
#=========================================================================================================#


#===========================================>    MS-PAYMENTS    <==========================================#
# URL base sobrescribible con MS_PAYMENTS_URL (en el cluster apunta al Service de Kubernetes)
quarkus.rest-client.ms-payments.url=${MS_PAYMENTS_URL:http://localhost:18002/api/v1/}

quarkus.rest-client.ms-payments.read-timeout=3000
quarkus.rest-client.ms-payments.connect-timeout=1000
#=========================================================================================================#


#=========================================>    DEV SERVICES    <===========================================#
# El servicio no necesita contenedores de apoyo. Evita que quarkus:dev descargue y arranque Docker
# (por ejemplo el stack LGTM que activa quarkus-opentelemetry) y los avisos de Testcontainers/Ryuk.
quarkus.devservices.enabled=false
#=========================================================================================================#
